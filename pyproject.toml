[project]
name = "medidor-consumo"
version = "0.1.0"
description = "Monitor local de consumo estimado de energia do computador"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pythonnet>=3.1.0",
]

[project.scripts]
medidor-consumo = "medidor_consumo:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
